name: Portable fonts and packages
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified archives as an Arterio GitHub prerelease
        type: boolean
        default: false
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  capture:
    name: Capture (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Build Linux on Debian 12 so the binary needs only glibc 2.36 and runs on Arterio's
    # production image, CI image, and Amp orbs.
    container: ${{ matrix.container }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
          - os: ubuntu-24.04
            container: debian:bookworm
    steps:
      - name: Install Debian tools
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git gnupg xz-utils zstd
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      # Debian 12's clang 14 cannot compile Skia's C++20 ranges code. LLVM's clang 19 still
      # links against Debian 12's libstdc++, so the binary keeps its glibc 2.36 baseline.
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/bookworm/ llvm-toolchain-bookworm-19 main" \
            > /etc/apt/sources.list.d/llvm.list
          apt-get update
          apt-get install -y --no-install-recommends build-essential clang-19 libclang-19-dev \
            libfontconfig1-dev locales ninja-build pkg-config python3
          ln -sf /usr/bin/clang-19 /usr/local/bin/clang
          ln -sf /usr/bin/clang++-19 /usr/local/bin/clang++
          echo "LIBCLANG_PATH=/usr/lib/llvm-19/lib" >> "$GITHUB_ENV"
          sed -i 's/^# *\(en_US.UTF-8\|ko_KR.UTF-8\)/\1/' /etc/locale.gen
          locale-gen
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install ninja
      - run: npm ci --ignore-scripts
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: portable-cpu-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: portable-cpu-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Build CPU-only portable fonts
        run: npm run build -- custom portable-fonts --release
      - name: Capture and check locales and drawing changes
        shell: bash
        run: |
          LANG=en_US.UTF-8 node tests/portable-fonts/capture.mjs artifacts/baseline
          LANG=ko_KR.UTF-8 node tests/portable-fonts/capture.mjs artifacts/locale
          node tests/portable-fonts/compare.mjs artifacts/baseline artifacts/locale
          LANG=en_US.UTF-8 node tests/portable-fonts/capture.mjs artifacts/label --changed-label
          LANG=en_US.UTF-8 node tests/portable-fonts/capture.mjs artifacts/line --removed-line
          node tests/portable-fonts/compare.mjs artifacts/baseline artifacts/label --expect-pixel-difference
          node tests/portable-fonts/compare.mjs artifacts/baseline artifacts/line --expect-pixel-difference
      - name: Verify npm packaging
        run: node tests/packaging.mjs
      - name: Pack the native optional dependency
        shell: bash
        run: |
          node lib/prebuild.mjs packages --local
          mkdir -p packages
          for package_dir in assets/npm/*; do
            npm pack "$package_dir" --pack-destination packages
          done
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ runner.os }}
          path: packages/*.tgz
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: portable-${{ runner.os }}
          path: artifacts
          retention-days: 14

  compare:
    name: Compare macOS and Linux
    needs: capture
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v7
        with:
          pattern: portable-*
          path: artifacts
      - run: node tests/portable-fonts/compare.mjs artifacts/portable-macOS/baseline artifacts/portable-Linux/baseline
      - uses: actions/download-artifact@v7
        with:
          pattern: native-*
          path: packages
          merge-multiple: true
      - name: Assemble root package with both native binaries
        run: |
          node lib/arterio-release.mjs packages
          cd packages && sha256sum *.tgz > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: packages
          if-no-files-found: error
          retention-days: 30

  install:
    name: Install archives (${{ matrix.os }})
    needs: compare
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
          - os: ubuntu-24.04
            container: debian:bookworm
    steps:
      - name: Install Debian tools
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git xz-utils zstd
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v7
        with:
          name: release-packages
          path: packages
      - run: npm install --global pnpm@11.20.0
      - run: node tests/packaging.mjs packages
      - run: node tests/packaging.mjs packages --pnpm

  release:
    name: Publish Arterio prerelease
    needs: install
    if: inputs.publish && github.ref == 'refs/heads/main' && github.repository == 'arteriohq/skia-canvas'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v7
        with:
          name: release-packages
          path: packages
      - name: Publish versioned archives without overwriting an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(node -p "require('./packages/release.json').tag")
          version=$(node -p "require('./packages/release.json').version")
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; increment the fork version for a new build."
            exit 1
          fi
          gh release create "$tag" packages/*.tgz packages/SHA256SUMS packages/release.json \
            --target "$GITHUB_SHA" --prerelease --title "Skia Canvas $version (Arterio)" \
            --notes-file docs/arterio-release-notes.md
          node -p "'Package URL: ' + require('./packages/release.json').root.url" >> "$GITHUB_STEP_SUMMARY"

  installed-release:
    name: Install published release (${{ matrix.os }})
    needs: release
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
          - os: ubuntu-24.04
            container: debian:bookworm
    steps:
      - name: Install Debian tools
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git xz-utils zstd
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v7
        with:
          name: release-packages
          path: packages
      - run: npm install --global pnpm@11.20.0
      - run: node tests/packaging.mjs packages --published
      - run: node tests/packaging.mjs packages --published --pnpm
